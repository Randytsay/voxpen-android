[project]
name = "voxpen-vertex-gateway"
version = "1.0.0"
description = "Authenticated OpenAI-compatible gateway for VoxPen and Vertex AI Gemini"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "google-auth>=2.35,<3",
  "google-cloud-speech>=2.28,<3",
  "httpx>=0.27,<1",
  "uvicorn[standard]>=0.30,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
