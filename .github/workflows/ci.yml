name: CI

on:
  push:
    branches: [main, dev]
    tags-ignore:
      - 'v*'
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Functional validation comes first. The repository has pre-existing
      # ktlint/detekt debt, so style reports must not hide compiler failures.
      - name: Build debug APK
        run: ./gradlew clean assembleDebug --stacktrace --no-build-cache

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-build-cache

      - name: Run ktlint report
        continue-on-error: true
        run: ./gradlew ktlintMainSourceSetCheck

      - name: Run detekt report
        continue-on-error: true
        run: ./gradlew detekt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
